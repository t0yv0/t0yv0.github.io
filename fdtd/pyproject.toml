[project]
name = "fdtd-donut"
version = "0.1.0"
description = "2D FDTD simulation of Maxwell's equations (TMz) around a metal donut"
requires-python = ">=3.10"
dependencies = [
    "jax[cpu]>=0.4.30",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.4.9",
    "mlx>=0.32.4",
]
